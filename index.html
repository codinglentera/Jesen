<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>pesawat simulator
</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="score">Skor: 0</div>
      <div id="lives">Nyawa: 3</div>
    </div>

    <div id="overlay" class="visible">
      <h1>Game Pesawat</h1>
      <p>Gunakan Panah / WASD untuk bergerak, Spasi untuk menembak</p>
      <button id="startBtn">Mulai</button>
      <p class="small">Atau klik/tap dan geser untuk mengendalikan pesawat.</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
